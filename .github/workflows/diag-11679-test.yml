# Runs the #11679 regression test on its own, on the JDK 8 leg where the hang was observed.
# Used to prove the test fails before the fix and passes after it.

name: diag-11679 regression test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      - name: Free disk space
        run: tools/github/free_disk_space.sh

      - name: Apply spotless and export the formatted sources
        run: |
          ./mvnw -B spotless:apply -pl :seatunnel-engine-server --no-snapshot-updates || true
          mkdir -p /tmp/formatted
          cp seatunnel-engine/seatunnel-engine-server/src/test/java/org/apache/seatunnel/engine/server/TaskDeployStaleContextRaceTest.java \
             /tmp/formatted/ 2>/dev/null || true
          git --no-pager diff --stat || true

      - name: Upload the spotless-formatted test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatted-sources
          path: /tmp/formatted
          if-no-files-found: warn

      - name: Run TaskDeployStaleContextRaceTest
        run: |
          set +e
          ./mvnw -B -T 1 verify \
            -DskipUT=false -DskipIT=true \
            -Dtest=TaskDeployStaleContextRaceTest -DfailIfNoTests=false \
            -D"license.skipAddThirdParty"=true -D"skip.ui"=true \
            --no-snapshot-updates -pl :seatunnel-engine-server -am -Pci \
            > /tmp/test.log 2>&1
          echo "maven exit code: $?"
          echo "----- result lines -----"
          grep -E "Tests run|BUILD|did not return within|ERROR\]" /tmp/test.log | tail -30
        env:
          MAVEN_OPTS: -Xmx4096m

      - name: Upload surefire reports and log
        if: always()
        run: |
          mkdir -p /tmp/out
          cp /tmp/test.log /tmp/out/ 2>/dev/null || true
          find . -path '*seatunnel-engine-server/target/surefire-reports/*' -type f \
            -exec cp {} /tmp/out/ \; 2>/dev/null || true
          ls -la /tmp/out | head -20

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-test-output
          path: /tmp/out
          if-no-files-found: warn
